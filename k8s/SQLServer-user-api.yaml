apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver-user-api
  labels:
    app: sqlserver
spec:
  serviceName: sqlserver-user-api
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver-user-api
  template:
    metadata:
      labels:
        app: sqlserver-user-api
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver-user-api
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-api-secret
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi